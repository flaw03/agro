name: CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'

env:
  BUN_VERSION: 'latest'

jobs:
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://yourdomain.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo " Deploying to production server..."
          # Add your deployment commands here
          # Examples:
          # - SSH deployment: ssh user@prod-server "cd /app && git pull && docker-compose up -d"
          # - Kubernetes: kubectl apply -f k8s/
          # - Cloud provider CLI: aws ecs update-service --cluster prod --service app --force-new-deployment

